<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ромашка - Охота</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            padding: 16px;
        }
        .card {
            background: #f5f5f5;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .photos-row {
            display: flex;
            gap: 8px;
            padding: 12px;
        }
        .photo {
            flex: 1;
            aspect-ratio: 1;
            background: #e0e0e0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background-size: cover;
            background-position: center;
        }
        .card-info {
            padding: 0 12px 12px 12px;
        }
        .card-name {
            font-size: 18px;
            font-weight: bold;
        }
        .card-age {
            font-size: 14px;
            color: #666;
            margin-left: 8px;
        }
        .card-city {
            font-size: 14px;
            color: #888;
            margin: 8px 0;
            padding: 6px;
            background: #e8e8e8;
            border-radius: 8px;
            text-align: center;
        }
        .boost-badge {
            background: #ffd700;
            color: #333;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .btn-reveal {
            background: #2481cc;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 12px;
        }
        h2 {
            margin-bottom: 16px;
        }
        .loading {
            text-align: center;
            padding: 48px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">Загрузка анкет...</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_URL = 'http://185.200.178.59:8001/api/rooms';

        // Функция для преобразования file_id в ссылку Telegram
        function getTelegramImageUrl(fileId) {
            return `https://api.telegram.org/file/bot${tg.initDataUnsafe.user.id}/photos/${fileId}`;
            // Временно используем эмодзи, так как нужен токен бота
            // Вместо реального фото пока оставляем эмодзи
            return '📸';
        }

        async function loadRooms() {
            try {
                const response = await fetch(`${API_URL}?page=1&per_page=20`);
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('app').innerHTML = `<div class="loading">Ошибка: ${data.error}</div>`;
                    return;
                }
                
                render(data.rooms);
            } catch (err) {
                document.getElementById('app').innerHTML = `<div class="loading">Ошибка загрузки: ${err.message}</div>`;
            }
        }

        function goToAlga(roomId, roomName) {
            tg.sendData(JSON.stringify({ 
                action: 'view_room', 
                room_id: roomId,
                room_name: roomName 
            }));
            tg.close();
        }

        function renderPhoto(photoValue, index) {
            if (photoValue && photoValue.startsWith('AgAC')) {
                // Это реальный file_id, но показать его в WebApp нельзя напрямую
                // Нужен бот-посредник. Пока показываем эмодзи
                if (index === 2) {
                    return '<div class="photo spoiler" style="display: flex; align-items: center; justify-content: center;">🔒</div>';
                } else {
                    return '<div class="photo" style="display: flex; align-items: center; justify-content: center;">📸</div>';
                }
            } else {
                // Эмодзи или пусто
                if (index === 2) {
                    return '<div class="photo spoiler" style="display: flex; align-items: center; justify-content: center;">🔒</div>';
                } else {
                    return '<div class="photo" style="display: flex; align-items: center; justify-content: center;">📸</div>';
                }
            }
        }

        function render(rooms) {
            if (!rooms || rooms.length === 0) {
                document.getElementById('app').innerHTML = '<div class="loading">😢 Пока нет анкет. Заходи позже!</div>';
                return;
            }

            let html = '<h2>🌸 Охота на девушек</h2>';
            
            for (let room of rooms) {
                html += '<div class="card">';
                html += '<div class="photos-row">';
                html += renderPhoto(room.photos[0], 0);
                html += renderPhoto(room.photos[1], 1);
                html += renderPhoto(room.photos[2], 2);
                html += '</div>';
                html += '<div class="card-info">';
                if (room.isBoosted) html += '<div class="boost-badge">🔥 ПОДНЯТО 🔥</div>';
                html += `<span class="card-name">${room.name}</span>`;
                html += `<span class="card-age">${room.age || '?'} лет</span>`;
                html += `<div class="card-city">🔒 Город скрыт. Пригласи 3 друзей!</div>`;
                html += `<button class="btn-reveal" onclick="goToAlga(${room.id}, '${room.name}')">🔥 Увидеть без маскировки 🔥</button>`;
                html += '</div></div>';
            }
            
            document.getElementById('app').innerHTML = html;
        }

        loadRooms();
    </script>
</body>
</html>
