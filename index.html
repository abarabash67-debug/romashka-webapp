<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ромашка - Анкеты</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            padding: 16px;
        }
        .card {
            background: #f5f5f5;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card-img {
            width: 100%;
            height: 200px;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }
        .card-info {
            padding: 12px;
        }
        .card-name {
            font-size: 18px;
            font-weight: bold;
        }
        .card-age, .card-city {
            font-size: 14px;
            color: #666;
            margin-top: 4px;
        }
        .card-price {
            font-size: 20px;
            font-weight: bold;
            color: #2481cc;
            margin: 8px 0;
        }
        .btn-buy {
            background: #2481cc;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
        }
        .loading {
            text-align: center;
            padding: 48px;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">Загрузка анкет...</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Временные демо-анкеты (пока нет API)
        const demoRooms = [
            { id: 1, name: "Мария", age: 23, city: "Москва", price: 100, preview: "📸" },
            { id: 2, name: "Анна", age: 25, city: "СПБ", price: 150, preview: "📸" },
            { id: 3, name: "Елена", age: 22, city: "Казань", price: 200, preview: "📸" }
        ];

        function buyRoom(roomId) {
            tg.sendData(JSON.stringify({ action: 'view_room', room_id: roomId }));
            tg.close();
        }

        function render() {
            const html = `
                <div>
                    <h2 style="margin-bottom: 16px;">🌸 Анкеты девушек</h2>
                    ${demoRooms.map(room => `
                        <div class="card">
                            <div class="card-img">${room.preview}</div>
                            <div class="card-info">
                                <div class="card-name">${room.name}, ${room.age}</div>
                                <div class="card-city">📍 ${room.city}</div>
                                <div class="card-price">⭐ ${room.price}</div>
                                <button class="btn-buy" onclick="buyRoom(${room.id})">Снять блюр</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        render();
    </script>
</body>
</html>
