<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ромашка</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial;
            padding: 16px;
            background: white;
        }
        .card {
            background: #f0f0f0;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            cursor: pointer;
        }
        .price {
            color: #2481cc;
            font-weight: bold;
            font-size: 18px;
        }
        button {
            background: #2481cc;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <h1>🌸 Анкеты</h1>
    <div id="rooms"></div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        function buyRoom(id) {
            tg.sendData(JSON.stringify({action:'view_room',room_id:id}));
            tg.close();
        }
        const rooms = [
            {id:123, name:"Мария, 23 года", city:"Москва", price:100},
            {id:456, name:"Анна, 25 лет", city:"СПб", price:150},
            {id:789, name:"Елена, 22 года", city:"Казань", price:80}
        ];
        document.getElementById('rooms').innerHTML = rooms.map(r => `
            <div class="card" onclick="buyRoom(${r.id})">
                <h3>📸 ${r.name}</h3>
                <p>${r.city}</p>
                <div class="price">⭐ ${r.price}</div>
                <button>Снять блюр</button>
            </div>
        `).join('');
    </script>
</body>
</html>
