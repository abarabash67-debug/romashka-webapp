<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Ромашка - Охота</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            padding: 16px;
        }
        .card {
            background: #f5f5f5;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .photos-row {
            display: flex;
            gap: 8px;
            padding: 12px;
        }
        .photo {
            flex: 1;
            aspect-ratio: 1;
            background: #e0e0e0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .spoiler {
            background: #2d2d2d;
            color: white;
        }
        .card-info {
            padding: 0 12px 12px 12px;
        }
        .card-name {
            font-size: 18px;
            font-weight: bold;
        }
        .card-age {
            font-size: 14px;
            color: #666;
            margin-left: 8px;
        }
        .card-city {
            font-size: 14px;
            color: #888;
            margin: 8px 0;
            padding: 6px;
            background: #e8e8e8;
            border-radius: 8px;
            text-align: center;
        }
        .boost-badge {
            background: #ffd700;
            color: #333;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .btn-reveal {
            background: #2481cc;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            margin-top: 12px;
        }
        h2 {
            margin-bottom: 16px;
        }
        .loading {
            text-align: center;
            padding: 48px;
            color: #666;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading">Загрузка анкет...</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let hunterHasRadar = false;

        const demoRooms = [
            { id: 1, name: "Мария", age: 23, city: "Москва", photos: ["📸", "📸", "🔒"], isBoosted: true },
            { id: 2, name: "Анна", age: 25, city: "СПБ", photos: ["📸", "📸", "🔒"], isBoosted: false },
            { id: 3, name: "Елена", age: 22, city: "Казань", photos: ["📸", "📸", "🔒"], isBoosted: true }
        ];

        function sortByBoost(rooms) {
            return [...rooms].sort((a, b) => {
                if (a.isBoosted === b.isBoosted) return 0;
                return a.isBoosted ? -1 : 1;
            });
        }

        function goToAlga(roomId, roomName) {
            tg.sendData(JSON.stringify({ action: 'view_room', room_id: roomId, room_name: roomName }));
            tg.close();
        }

        function render() {
            const sorted = sortByBoost(demoRooms);
            let html = '<h2>🌸 Охота на девушек</h2>';
            for (let room of sorted) {
                html += `
                    <div class="card">
                        <div class="photos-row">
                            <div class="photo">${room.photos[0]}</div>
                            <div class="photo">${room.photos[1]}</div>
                            <div class="photo spoiler">${room.photos[2]}</div>
                        </div>
                        <div class="card-info">
                            ${room.isBoosted ? '<div class="boost-badge">🔥 ПОДНЯТО 🔥</div>' : ''}
                            <span class="card-name">${room.name}</span>
                            <span class="card-age">${room.age} лет</span>
                            <div class="card-city">
                                ${hunterHasRadar ? '📍 ' + room.city : '🔒 Город скрыт. Пригласи 3 друзей!'}
                            </div>
                            <button class="btn-reveal" onclick="goToAlga(${room.id}, '${room.name}')">
                                🔥 Увидеть без маскировки 🔥
                            </button>
                        </div>
                    </div>
                `;
            }
            document.getElementById('app').innerHTML = html;
        }

        render();
    </script>
</body>
</html>
